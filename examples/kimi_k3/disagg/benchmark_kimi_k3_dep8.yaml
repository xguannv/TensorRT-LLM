# Kimi K3 disaggregated serving at DEP8 (1 ctx + 1 gen, 2 nodes each).
#
# Derived from benchmark_kimi_k3_dep16.yaml. Only the parallelism, the memory
# knobs that DEP8 forced, and the FP8 weight-read env are different; every
# constraint the DEP16 config documents still applies (NIXL + PYTHON
# transceiver, 1024 MB bounce, tokens_per_block 64, block reuse off, matched
# ctx/gen DEP, ctx and gen inside ONE NVL72 domain).
#
# 🔴 Why DEP8 ctx is worth trying at all. disagg/README.md rules it "an open
# (likely negative) question on GB300", on an estimate of ~273 GiB/rank for
# weights alone against a 288 GiB card. That estimate predates FP8-resident
# attention: aggregated DEP8 now measures **239.70 / 246.14 GiB/rank** and runs
# GSM8K 96.5125 / GPQA-D 92.4242 (jobs 484973 / 485168). The premise the README
# ruled on has changed, so the question is re-opened rather than contradicted.
#
# Requires the construction-time FP8 KDA path selected from the checkpoint's
# FP8 datatype. Allocating those weights as BF16 would OOM DEP8 before reading
# a single weight.
slurm:
  script_file: "disaggr_torch.slurm"
  partition: "batch"
  account: "coreai_comparch_inferencex"
  job_time: "02:00:00"
  job_name: "k3-disagg-dep8"
  extra_args: "--gpus-per-node=4"
  numa_bind: true  # GB200/GB300 NVL72
benchmark:
  mode: "e2e"  # e2e | gen_only | gen_only_no_context
  use_nv_sa_benchmark: false
  multi_round: 1          # first bring-up: one round, not four
  benchmark_ratio: 0.8
  streaming: true
  concurrency_list: "16"
  input_length: 8192
  output_length: 1024
  dataset_file: "/lustre/fsw/portfolios/coreai/users/xguan/dev/datasets/kimi_k3_8192_1024_128req_trtllm_custom.jsonl"
  env_var:
    TRTLLM_PATH_PREPEND: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM/.venv-3.12/bin"
    TRTLLM_PYTHONPATH_PREPEND: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM"
hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1
environment:
  # Physical path on both sides of the colon: the venv console-script shebangs
  # bake in the install-time path, so a symlinked /lustre/... mount gives
  # "cannot execute" (exit 127).
  container_mount: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM:/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM,/lustre:/lustre,/scratch:/scratch"
  container_image: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM/build_images/5d86e96249/trtllm-k3deps-c450.sqsh"
  model_path: "/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/nvidia_kimi-k3-nvfp4/hf/hf-1ec10fa_orig"
  trtllm_repo: ""
  build_wheel: false
  trtllm_wheel_path: ""
  # Health-check budget for the proxy. The harness default is 1800 s and K3 at
  # DEP8 does not reliably fit inside it: 489792 had both workers healthy at
  # ~22 min, while 491105 -- same config, same cluster -- was still finishing
  # ctx post-load init when 1800 s expired and the job was failed with
  # "Server not healthy after 1800 seconds". Weights had loaded correctly
  # (245.05 GiB/rank, the expected figure); only the deadline was wrong.
  server_health_timeout: 5400
  work_dir: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM/disagg_dep8_out"
  worker_env_var: "TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 ENROOT_ALLOW_DEV=yes TRTLLM_WORKER_UCX_TLS=tcp,self,sm,cuda_copy,cuda_ipc TRTLLM_PATH_PREPEND=/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM/.venv-3.12/bin TRTLLM_PYTHONPATH_PREPEND=/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM"
  server_env_var: "TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_PATH_PREPEND=/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM/.venv-3.12/bin TRTLLM_PYTHONPATH_PREPEND=/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/jonasl/GitRepos/TensorRT-LLM"
worker_config:
  gen:
    tensor_parallel_size: 8
    moe_expert_parallel_size: 8
    enable_attention_dp: true
    pipeline_parallel_size: 1
    # Baseline first: the documented disagg settings, so a failure is
    # attributable to DEP8 rather than to a scheduler change. The
    # overlap-scheduler / CUDA-graph variants come after this runs.
    disable_overlap_scheduler: true
    enable_chunked_prefill: false
    cuda_graph_config: null
    # 8, not the DEP16 config's 8-for-SA reason: at DEP8 the V2 Mamba manager's
    # minimum quota scales linearly with resident sequences, and aggregated
    # DEP8 measured need=14.39 GiB at batch 32 versus a ~6-7 GiB quota. Batch 8
    # puts the minimum near 3.8 GiB. SA is off for this first bring-up.
    max_batch_size: 8
    max_num_tokens: 256
    max_seq_len: 9236
    print_iter_log: true
    # K3 NVFP4 SiTU supports TRTLLM and MEGAMOE_DEEPGEMM. Keep both
    # workers on TRTLLM here: this matches the aggregate DEP8 accuracy recipe
    # and is validated through the disaggregated proxy on a 4x4 allocation.
    # max_num_tokens is a chunking ceiling, not a resident token allocation.
    moe_config:
      backend: TRTLLM
      max_num_tokens: 131072
      use_low_precision_moe_combine: true
    kv_cache_config:
      enable_block_reuse: false   # mandatory for K3 (KDA state)
      tokens_per_block: 64        # mandatory for K3 MLA kernels
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON  # mandatory: C++ path throws for K3
      max_tokens_in_buffer: 8448
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true
  ctx:
    tensor_parallel_size: 8
    moe_expert_parallel_size: 8
    enable_attention_dp: true
    pipeline_parallel_size: 1
    disable_overlap_scheduler: true   # documented as mandatory for disagg ctx
    enable_chunked_prefill: false
    cuda_graph_config: null
    max_batch_size: 1
    max_num_tokens: 8448
    max_seq_len: 8212
    print_iter_log: true
    # Match the aggregate DEP8 TRTLLM SiTU configuration on the context side.
    # max_num_tokens is a chunking ceiling, not a resident token allocation.
    moe_config:
      backend: TRTLLM
      max_num_tokens: 131072
      use_low_precision_moe_combine: true
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 64
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8448
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true
