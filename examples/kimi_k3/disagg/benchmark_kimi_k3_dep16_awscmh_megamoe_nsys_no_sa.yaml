# MegaMoE variant of benchmark_kimi_k3_dep16_awscmh_nsys_no_sa.yaml.
#
# Identical workload, topology, dataset and 512-request UCX warmup; the only
# functional change is the routed-expert backend:
#
#   worker_config.{ctx,gen}.moe_config.backend: MEGAMOE_DEEPGEMM
#
# plus the checkout/image that carry it (trtllm_work3, image 9e808e660f).
#
# Deliberately NOT setting moe_config.max_num_tokens. For MegaMoE that key is
# the SymmBuffer capacity, not a chunking bound, and it is divided by ep_size
# under attention DP. ModelConfig already defaults it to
# max_num_tokens * dp_size, which lands exactly right here:
#
#   ctx: 8448 * 16 / 16 = 8448 per rank   (needs 8448)
#   gen:  256 * 16 / 16 =  256 per rank   (needs 256)
#
# Copying the 131072 used by the GSM8K eval config would over-allocate the
# generation SymmBuffer 32x and eat into the KV cache. Copying the old 33024
# would under-allocate the context one and abort during autotuner warmup with
#   AssertionError: MegaMoE got 8192 tokens but buffer is sized for 2064
#
# Backend selection fails loudly, never silently: KimiK3MoERuntime raises if
# the MoE factory resolves an explicit MEGAMOE_DEEPGEMM request to anything
# else, so a number produced by this config is attributable.
#
# See notes/run_records/kimi_k3/0729_megamoe_gsm8k.md.

slurm:
  script_file: "disaggr_torch.slurm"
  partition: "batch"
  account: "coreai_comparch_trtllm"
  job_time: "02:00:00"
  job_name: "k3-disagg-8k1k-megamoe-nsys-no-sa"
  extra_args: "--gpus-per-node=4"
  set_segment: true
  numa_bind: true

benchmark:
  mode: "e2e"
  use_nv_sa_benchmark: false
  multi_round: 4
  benchmark_ratio: 0.8
  streaming: true
  concurrency_list: "16"
  input_length: 8192
  output_length: 1024
  dataset_file: "/home/xguan/dev/run_records/kimi_k3_disagg/datasets/kimi_k3_8192_1024_128req_trtllm_custom.jsonl"
  # Keep the baseline's default explicit: 2 * ctx_dp16 * gen_dp16.
  ucx_warmup_requests: 512
  env_var:
    TRTLLM_PATH_PREPEND: "/code/tensorrt_llm/.venv-3.12/bin"
    TRTLLM_PYTHONPATH_PREPEND: "/code/tensorrt_llm"

hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1

environment:
  container_mount: "/home/xguan/dev/trtllm_work3:/code/tensorrt_llm,/home/xguan/dev/run_records:/home/xguan/dev/run_records,/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/moonshotai_kimi-k3/hf/hf-301be1b_orig:/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/moonshotai_kimi-k3/hf/hf-301be1b_orig"
  # Built by notes/aws_scripts/make_image.sh. Ships TensorRT-LLM 1.3.0rc21,
  # Nsight Systems 2025.5.0, and the Kimi K3 prerequisites: fla-core 0.5.2,
  # einops 0.8.2 and FlashInfer 0.6.15 (the K3 fork, not the pinned 0.6.14).
  container_image: "/home/xguan/dev/containers/trtllm-awscmh-gb300-dev-9e808e660f-nsys2025.5-20260729.sqsh"
  model_path: "/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/moonshotai_kimi-k3/hf/hf-301be1b_orig"
  trtllm_repo: ""
  build_wheel: false
  trtllm_wheel_path: ""
  work_dir: ""
  worker_env_var: "TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 ENROOT_ALLOW_DEV=yes NSYS_BIN=/opt/nvidia/nsight-systems-cli/2025.5.0/target-linux-sbsa-armv8/nsys TRTLLM_WORKER_UCX_TLS=tcp,self,sm,cuda_copy,cuda_ipc TRTLLM_PATH_PREPEND=/code/tensorrt_llm/.venv-3.12/bin TRTLLM_PYTHONPATH_PREPEND=/code/tensorrt_llm TRITON_CACHE_DIR=/tmp/triton-cache-k3-disagg FLASHINFER_WORKSPACE_BASE=/tmp/flashinfer-k3-disagg HF_HOME=/tmp/hf-cache-k3-disagg HF_MODULES_CACHE=/tmp/hf-modules-k3-disagg XDG_CACHE_HOME=/tmp/xdg-cache-k3-disagg"
  server_env_var: "TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_PATH_PREPEND=/code/tensorrt_llm/.venv-3.12/bin TRTLLM_PYTHONPATH_PREPEND=/code/tensorrt_llm"

profiling:
  nsys_on: true
  # CTX: capture everything. Windowing this worker has failed repeatedly because
  # the formal prefills are a tiny, badly-located target: three runs put their
  # start at 2613, 2470 and 1819 -- 794 iterations of drift, trending down --
  # and they are only ~65 of the worker's ~1885 iterations, i.e. 3.5% of the
  # run, sitting right at its end. Job 2715591 lost its context report entirely
  # this way. A start iteration of 1 is the only one guaranteed to be reached.
  # The cost is low because context iterations are sparse: the formal prefills
  # are ~2.2 s apart and the worker is idle in between, so most of the captured
  # span carries no kernels at all.
  ctx_profile_range: "1-99999"
  # GEN: keep a window. The asymmetry with CTX is the point -- generation spends
  # thousands of contiguous iterations in formal decode (261-5142 in job 2714952,
  # ~1721-5115 in job 2716479), so a mid-range window cannot realistically miss,
  # while capturing all of it would cost ~2.9 GB per rank (~46 GB per run) and
  # make the SQLite export step painfully slow.
  gen_profile_range: "3000-3200"

accuracy:
  enable_accuracy_test: false

worker_config:
  gen:
    tensor_parallel_size: 16
    moe_expert_parallel_size: 16
    moe_config:
      backend: MEGAMOE_DEEPGEMM
    enable_attention_dp: true
    pipeline_parallel_size: 1
    disable_overlap_scheduler: true
    enable_chunked_prefill: false
    cuda_graph_config:
      max_batch_size: 32
    max_batch_size: 32
    max_num_tokens: 256
    max_seq_len: 9236
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 64
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8448
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true

  ctx:
    tensor_parallel_size: 16
    moe_expert_parallel_size: 16
    moe_config:
      backend: MEGAMOE_DEEPGEMM
    enable_attention_dp: true
    pipeline_parallel_size: 1
    disable_overlap_scheduler: true
    enable_chunked_prefill: false
    cuda_graph_config: null
    max_batch_size: 1
    max_num_tokens: 8448
    max_seq_len: 8212
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 64
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8448
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true
