# AWS CMH Kimi K3 8k/1k Nsight Systems run:
#   - Same workload, topology, model, image, and 512-request UCX warmup as
#     benchmark_kimi_k3_dep16_awscmh_no_sa.yaml.
#   - Suffix-automaton speculative decoding remains disabled.
#   - Every worker is launched under the explicitly selected Nsys 2025.5
#     binary shipped in the AWS CMH image.
#
# Both workers spend most of their iterations on the 512-request UCX warmup, so
# the harness defaults (ctx 10-30, gen 200-250) land in warmup and would capture
# no formal 8192-token traffic at all.
#
# The formal traffic does not start at a reproducible iteration, because the
# number of warmup iterations is itself not reproducible. Two measured runs:
#
#   job 2714952 (logs/awscmh_8k1k_20260729_022937)       formal CTX 2613-2673
#   job 2715591 (logs/awscmh_8k1k_nsys_20260729_040930)  formal CTX 2470-2534
#
# That is 143 iterations of drift, so no narrow window can hit both. Note also
# that the context worker does NOT advance its iteration counter while idle --
# in the first run the last warmup iteration is 2612 and the first formal one is
# 2613, with no gap across the idle period between them. Job 2715591 confirmed
# the failure mode: a window of 2635-2655 was never reached, because that worker
# stopped iterating at 2534, and no context report was produced at all.
#
# The ranges below are therefore chosen for reachability rather than tightness.
# Only the START iteration has to be reached: with --capture-range-end=stop, a
# stop iteration that never arrives still leaves Nsys writing what it collected
# when the process exits. So each start sits far below the earliest observed
# warmup end, and each stop is generous.

slurm:
  script_file: "disaggr_torch.slurm"
  partition: "batch"
  account: "coreai_comparch_trtllm"
  job_time: "02:00:00"
  job_name: "k3-disagg-8k1k-nsys-no-sa"
  extra_args: "--gpus-per-node=4"
  set_segment: true
  numa_bind: true

benchmark:
  mode: "e2e"
  use_nv_sa_benchmark: false
  multi_round: 4
  benchmark_ratio: 0.8
  streaming: true
  concurrency_list: "16"
  input_length: 8192
  output_length: 1024
  dataset_file: "/home/xguan/dev/run_records/kimi_k3_disagg/datasets/kimi_k3_8192_1024_128req_trtllm_custom.jsonl"
  # Keep the baseline's default explicit: 2 * ctx_dp16 * gen_dp16.
  ucx_warmup_requests: 512
  env_var:
    TRTLLM_PATH_PREPEND: "/code/tensorrt_llm/.venv-3.12/bin"
    TRTLLM_PYTHONPATH_PREPEND: "/code/tensorrt_llm"

hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1

environment:
  container_mount: "/home/xguan/dev/trtllm_work:/code/tensorrt_llm,/home/xguan/dev/run_records:/home/xguan/dev/run_records,/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/moonshotai_kimi-k3/hf/hf-301be1b_orig:/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/moonshotai_kimi-k3/hf/hf-301be1b_orig"
  # Built by notes/aws_scripts/make_image.sh. Ships TensorRT-LLM 1.3.0rc21,
  # Nsight Systems 2025.5.0, and the Kimi K3 prerequisites: fla-core 0.5.2,
  # einops 0.8.2 and FlashInfer 0.6.15 (the K3 fork, not the pinned 0.6.14).
  container_image: "/home/xguan/dev/containers/trtllm-awscmh-gb300-dev-9e4492bf4e-nsys2025.5-20260729.sqsh"
  model_path: "/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/moonshotai_kimi-k3/hf/hf-301be1b_orig"
  trtllm_repo: ""
  build_wheel: false
  trtllm_wheel_path: ""
  work_dir: ""
  worker_env_var: "TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 ENROOT_ALLOW_DEV=yes NSYS_BIN=/opt/nvidia/nsight-systems-cli/2025.5.0/target-linux-sbsa-armv8/nsys TRTLLM_WORKER_UCX_TLS=tcp,self,sm,cuda_copy,cuda_ipc TRTLLM_PATH_PREPEND=/code/tensorrt_llm/.venv-3.12/bin TRTLLM_PYTHONPATH_PREPEND=/code/tensorrt_llm TRITON_CACHE_DIR=/tmp/triton-cache-k3-disagg FLASHINFER_WORKSPACE_BASE=/tmp/flashinfer-k3-disagg HF_HOME=/tmp/hf-cache-k3-disagg HF_MODULES_CACHE=/tmp/hf-modules-k3-disagg XDG_CACHE_HOME=/tmp/xdg-cache-k3-disagg"
  server_env_var: "TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_PATH_PREPEND=/code/tensorrt_llm/.venv-3.12/bin TRTLLM_PYTHONPATH_PREPEND=/code/tensorrt_llm"

profiling:
  nsys_on: true
  # CTX: the two observed warmup ends are 2469 and 2612, so starting at 1800
  # leaves at least 669 iterations of margin -- about 4.7x the drift measured so
  # far -- and the capture then runs through every formal prefill under either
  # offset. The cost is ~670-810 warmup iterations of trace, which is cheap:
  # those iterations carry ~105 tokens each against 8192 for a formal prefill.
  ctx_profile_range: "1800-2800"
  # GEN: the formal decode spans roughly 250-5100 in both runs, so this window
  # is never in danger of missing. It is widened from the 50 iterations of job
  # 2715591 to 200 purely to sample more decode steps; at ~33 ms/iter that is
  # ~6.6 s of trace, and 50 iterations already cost only ~29 MB per rank.
  gen_profile_range: "1500-1700"

accuracy:
  enable_accuracy_test: false

worker_config:
  gen:
    tensor_parallel_size: 16
    moe_expert_parallel_size: 16
    enable_attention_dp: true
    pipeline_parallel_size: 1
    disable_overlap_scheduler: true
    enable_chunked_prefill: false
    cuda_graph_config:
      max_batch_size: 32
    max_batch_size: 32
    max_num_tokens: 256
    max_seq_len: 9236
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 64
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8448
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true

  ctx:
    tensor_parallel_size: 16
    moe_expert_parallel_size: 16
    enable_attention_dp: true
    pipeline_parallel_size: 1
    disable_overlap_scheduler: true
    enable_chunked_prefill: false
    cuda_graph_config: null
    max_batch_size: 1
    max_num_tokens: 8448
    max_seq_len: 8212
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 64
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8448
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true
